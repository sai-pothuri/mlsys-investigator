# DO NOT commit real keys. Populate via:
#   kubectl create secret generic mlsys-secrets -n mlsys-investigator \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
#     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-...
#
# Or seal with kubeseal / Vault agent before committing.
apiVersion: v1
kind: Secret
metadata:
  name: mlsys-secrets
  namespace: mlsys-investigator
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  LANGFUSE_PUBLIC_KEY: "REPLACE_ME"
  LANGFUSE_SECRET_KEY: "REPLACE_ME"
