apiVersion: v1
kind: Service
metadata:
  name: mlsys-investigator
  namespace: mlsys-investigator
  labels:
    app: mlsys-investigator
spec:
  # ClusterIP: reachable inside the cluster (recommended for Alertmanager webhook).
  # Change to LoadBalancer or NodePort to expose externally.
  type: ClusterIP
  selector:
    app: mlsys-investigator
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
